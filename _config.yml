# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: Seek Another Land
subtitle: 'A Land of Nobody'
description: 'A Land of Nobody'
keywords:
author:  Nobody
language: zh-CN
timezone: ''

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: https://blog.seekanotherland.xyz
# url: https://seekanotherland.xyz/hexo-butterfly-demo
# permalink: :year/:month/:day/:title/
permalink: posts/:abbrlink.html
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true  # true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true  # true
  tab_replace: ''

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'mtime'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: butterfly


# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  # type: '' 
  type: git
  repository: git@github.com:Bit-Part-Young/hexo-demo.git
  # repository: git@github.com:Bit-Part-Young/hexo-butterfly-demo.git
  branch: gh-pages


# Local search
# search:
#   path: search.xml
#   field: site
#   content: true
#   template: ./search.xml

plugins:
  - hexo-algoliasearch


# Algolia search
algolia:
  appId: "ZXNTCRC3PO"
  apiKey: "a5f3117962ccbe55efc1e0033646e1e1"
  adminApiKey: "d713ed9d9bb0b0d8d07505f7273bdcee"
  chunkSize: 5000
  indexName: "hexo-sites"
  fields:
    - content:strip:truncate,0,500
    - excerpt:strip
    - gallery
    - permalink
    - photos
    - slug
    - tags
    - title

# RSS 订阅
feed:
  enable: true  # 启用或禁用 Feed 插件，true 为启用，false 为禁用
  type:
    - atom
    - rss2
  path:  # 设置 Feed 文件的路径，当输出两种类型时，需要按照类型顺序设置路径
    - atom.xml
    - rss2.xml
  limit: 20  # 设置 Feed 中显示的文章数量上限，0 或 false 表示显示所有文章
  hub:  # PubSubHubbub 中心 URL，如果不使用可以留空
  content:  # 是否在 Feed 中包含文章全文内容，true 为包含，false 为不包含
  content_limit: 140  # 设置 Feed 中文章内容的长度限制，仅当 content 为 false 时有效
  content_limit_delim: ' '  # 设置内容长度限制的分割符，默认为空格
  order_by: -date  # 设置 Feed 中文章的排序方式，默认按日期倒序
  icon: icon.png  # 设置 Feed 的图标，默认使用 _config.yml 中指定的电子邮件的 gravatar
  autodiscovery: true  # 是否启用 Feed 的自动发现功能，true 为启用，false 为禁用
  template:  # 设置自定义 Feed 模板的路径，可以指定一个或多个模板
